spring.application.name=corallineage-backend

# Database config
spring.datasource.url=jdbc:postgresql://localhost:5433/coral_framework
spring.datasource.username=coral_user
spring.datasource.password=coral_pass
spring.datasource.driver-class-name=org.postgresql.Driver

## Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flask app
app.ml-service.url=http://localhost:5001

# MLFlow
app.mlflow.url=http://localhost:5000

# DVC integration
app.dvc.working-directory=C:/Users/zechn/OneDrive/CS/FYP Project/corallineage
app.dvc.data-dir=dataset
app.dvc.remote-name=origin

# Dataset import
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

